<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AABHA | My Account</title>
<meta name="theme-color" content="#120f16">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
:root{--serif:"Bodoni Moda",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--bg:#120f16;--bg2:#1d1626;--ink:#f6efe9;--mut:#b4a9ba;--ac:#e8b4a0;--ac2:#b8715a;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);line-height:1.6;background:linear-gradient(160deg,var(--bg),var(--bg2));padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font:700 1.5rem var(--serif);letter-spacing:.28em;color:var(--ac);text-decoration:none}
.hr{display:flex;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
h2{font:600 1.6rem var(--serif);margin:0 0 10px}
.btn{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 22px;border-radius:40px;font:800 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:var(--gl);border:1px solid var(--gb);color:var(--ink)}
.btn:disabled{opacity:.5}
.glass{background:var(--gl);border:1px solid var(--gb);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card{padding:20px;margin-bottom:16px}
input{width:100%;background:var(--gl);border:1px solid var(--gb);border-radius:14px;color:var(--ink);padding:14px 16px;font:inherit;outline:none;margin-bottom:12px}
input:focus{border-color:var(--ac)}
.mut{color:var(--mut)}.ac{color:var(--ac)}.ok{color:#9ddba3}.er{color:#ff9aa8}
.stars{color:var(--ac);font-size:1.5rem;letter-spacing:.15em}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font:800 11px var(--sans);background:var(--ac2);color:#fff}
.badge.c{background:#6b7280}.badge.d{background:#2f855a}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tl{display:flex;margin:16px 0 8px}
.tl div{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative}
.tl div::before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--gb);margin:0 auto 4px;position:relative;z-index:1}
.tl div::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--gb)}
.tl div:first-child::after{display:none}
.tl div.on{color:var(--ink)}
.tl div.on::before,.tl div.on::after{background:var(--ac)}
.ev{font-size:12.5px;color:var(--mut);border-top:1px dashed var(--gb);padding:6px 0}
.n{padding:10px 0;border-top:1px solid var(--gb)}
.n.u{border-left:3px solid var(--ac);padding-left:10px}
.sum{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="../">AABHA</a>
  <div class="hr"><button class="btn g" id="lg" type="button">বাং</button><button class="btn g" id="so" type="button" data-i="signout" hidden>Sign out</button></div>
</header>
<p class="er" id="err" hidden></p>

<section id="login" class="glass card" hidden>
  <h2 data-i="loginT">Log in to your account</h2>
  <p class="mut" data-i="loginS">Enter your email and password. New here? Tap Create account.</p>
  <form id="lf">
    <input id="em" type="email" required autocomplete="email" data-ph="email" placeholder="Your email">
    <input id="pw" type="password" required minlength="6" autocomplete="current-password" data-ph="pass" placeholder="Password (at least 6 characters)">
    <div class="row">
      <button class="btn" id="bl" type="submit" data-i="loginBtn">Log in</button>
      <button class="btn g" id="bs" type="button" data-i="signup">Create account</button>
    </div>
  </form>
  <p id="lm" style="margin-top:12px"></p>
</section>

<section id="app" hidden>
  <a class="btn g" href="../" data-i="back" style="margin-bottom:16px">Back to shop</a>
  <div class="glass card" id="loy"></div>
  <div class="glass card"><h2 data-i="msgs">Messages</h2><div id="nts"></div></div>
  <h2 data-i="orders">My Orders</h2>
  <div id="ords"></div>
  <div class="glass card">
    <h2 data-i="details">My details</h2>
    <form id="df">
      <input id="nm" data-ph="name" placeholder="Your name">
      <input id="ph" type="tel" data-ph="phone" placeholder="Phone number">
      <button class="btn" type="submit" data-i="save">Save</button>
    </form>
    <p id="dm" style="margin-top:10px"></p>
  </div>
</section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s),CFG=window.AABHA_CONFIG||{},ETA=CFG.ETA||[2,4],TK='\u09F3';
const sb=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG='en';try{LANG=localStorage.getItem('aa_lang')||'en'}catch(e){}
const T={
en:{loginT:'Log in to your account',loginS:'Enter your email and password. New here? Tap Create account.',loginBtn:'Log in',signup:'Create account',email:'Your email',pass:'Password (at least 6 characters)',badEmail:'Please enter a valid email.',badPass:'Password must be at least 6 characters.',wrong:'Wrong email or password.',exists:'This email may already have an account. Please tap Log in.',confirmOn:'Account created, but email confirmation is still ON in Supabase. Please turn it off.',fail:'Something went wrong. Please try again.',signout:'Sign out',back:'Back to shop',msgs:'Messages',noMsgs:'No messages yet.',markRead:'Mark all read',orders:'My Orders',noOrders:'No orders yet. Your first order unlocks a 10% gift card!',details:'My details',name:'Your name',phone:'Phone number',save:'Save',saved:'Saved!',eta:'Expected delivery',total:'Total',courier:'Courier',trackNo:'Tracking no.',recv:'✓ I received my order',recvd:'✓ You confirmed receipt. Thank you!',loy:'Loyalty',orderedN:'orders',gift:'Gift card',card:'Loyalty card',next10:'off your next order',unlock:'Place your first order to unlock a 10% gift card and 2 stars.',freeHave:'🎁 You have a free item on your next order!',freeIn:'more orders to earn a free item',noCfg:'The site is not connected yet (config.js is missing).',order:'Order',pending:'Order placed',confirmed:'Confirmed',processing:'Preparing',shipped:'On the way',delivered:'Delivered',cancelled:'Cancelled',err:'Could not load your data. Please refresh.'},
bn:{loginT:'আপনার অ্যাকাউন্টে লগইন করুন',loginS:'ইমেইল আর পাসওয়ার্ড দিন। নতুন হলে "অ্যাকাউন্ট খুলুন" চাপুন।',loginBtn:'লগইন',signup:'অ্যাকাউন্ট খুলুন',email:'আপনার ইমেইল',pass:'পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)',badEmail:'সঠিক ইমেইল দিন।',badPass:'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',wrong:'ইমেইল বা পাসওয়ার্ড ভুল।',exists:'এই ইমেইলে হয়তো আগেই অ্যাকাউন্ট আছে। "লগইন" চাপুন।',confirmOn:'অ্যাকাউন্ট খোলা হয়েছে, কিন্তু Supabase-এ ইমেইল কনফার্মেশন এখনো চালু। সেটা বন্ধ করুন।',fail:'কিছু একটা ভুল হয়েছে। আবার চেষ্টা করুন।',signout:'সাইন আউট',back:'শপে ফিরুন',msgs:'মেসেজ',noMsgs:'এখনো কোনো মেসেজ নেই।',markRead:'সব পড়া হয়েছে',orders:'আমার অর্ডার',noOrders:'এখনো কোনো অর্ডার নেই। প্রথম অর্ডারেই পাবেন ১০% গিফট কার্ড!',details:'আমার তথ্য',name:'আপনার নাম',phone:'ফোন নম্বর',save:'সেভ করুন',saved:'সেভ হয়েছে!',eta:'আনুমানিক ডেলিভারি',total:'মোট',courier:'কুরিয়ার',trackNo:'ট্র্যাকিং নম্বর',recv:'✓ আমি পণ্য পেয়েছি',recvd:'✓ আপনি পণ্য পাওয়ার কথা নিশ্চিত করেছেন। ধন্যবাদ!',loy:'লয়্যালটি',orderedN:'টি অর্ডার',gift:'গিফট কার্ড',card:'লয়্যালটি কার্ড',next10:'ছাড় আপনার পরের অর্ডারে',unlock:'প্রথম অর্ডার করলেই পাবেন ১০% গিফট কার্ড ও ২ স্টার।',freeHave:'🎁 আপনার পরের অর্ডারে একটি পণ্য ফ্রি!',freeIn:'টি অর্ডার করলেই একটি ফ্রি পণ্য',noCfg:'সাইট এখনো সংযুক্ত হয়নি (config.js নেই)।',order:'অর্ডার',pending:'অর্ডার গৃহীত',confirmed:'কনফার্ম হয়েছে',processing:'প্রস্তুত হচ্ছে',shipped:'পথে আছে',delivered:'পৌঁছে গেছে',cancelled:'বাতিল',err:'তথ্য লোড হয়নি। রিফ্রেশ করুন।'}};
const t=k=>(T[LANG]&&T[LANG][k])||T.en[k]||k;
const fm=n=>TK+Number(n||0).toLocaleString('en-US');
const dt=x=>x?new Date(x).toLocaleString(LANG==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const STEPS=['pending','confirmed','processing','shipped','delivered'];
let SESS=null,CACHE=null,busy=false,filled=false;

function S(){
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('#lg').textContent=LANG==='bn'?'EN':'বাং';
  document.documentElement.lang=LANG;
}

function renderLoy(p){
  const n=p?+p.orders_count:0,fc=p?+p.free_item_credit:0;
  const stars=n>=10?5:n>=5?4:n>=3?3:n>=1?2:0,disc=n>=3?20:n>=1?10:0;
  $('#loy').innerHTML=`<h2>${t('loy')}</h2><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div><p class="mut">${n} ${t('orderedN')}</p>`
   +(disc?`<p><b class="ac">${disc}%</b> ${t('next10')} · ${t(n>=3?'card':'gift')}</p>`:`<p>${t('unlock')}</p>`)
   +(fc>0?`<p>${t('freeHave')}</p>`:`<p class="mut">${10-(n%10)} ${t('freeIn')}</p>`);
}

function orderCard(o,C){
  const items=C.items.filter(i=>i.order_id===o.id);
  const evs=C.events.filter(e=>e.order_id===o.id).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const cx=o.status==='cancelled',idx=STEPS.indexOf(o.status);
  const bcls=cx?'c':o.status==='delivered'?'d':'';
  let eta='';
  if(!cx&&o.status!=='delivered'){
    const a=o.eta_min||ETA[0],b=o.eta_max||ETA[1],base=new Date(o.created_at).getTime();
    const f=d=>new Date(base+d*864e5).toLocaleDateString(LANG==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short'});
    eta=`<p><b>${t('eta')}:</b> ${f(a)} – ${f(b)}</p>`;
  }
  const recv=o.status==='delivered'?(o.received_at?`<p class="ok">${t('recvd')}</p>`:`<button class="btn" data-recv="${esc(o.id)}">${t('recv')}</button>`):'';
  const tl=cx?'':`<div class="tl">${STEPS.map((s,i)=>`<div class="${i<=idx?'on':''}">${t(s)}</div>`).join('')}</div>`;
  return `<div class="glass card">
    <div class="top"><div><b class="ac" style="font-size:1.2rem">${t('order')} #${esc(o.order_no)}</b><div class="mut" style="font-size:12px">${dt(o.created_at)}</div></div><span class="badge ${bcls}">${t(o.status)}</span></div>
    ${tl}${eta}
    <p class="mut" style="font-size:14px">${items.map(i=>`${i.qty} × ${esc(i.name)}${i.size?' ('+esc(i.size)+')':''}${i.free?' 🎁':''}`).join('<br>')}</p>
    <div class="sum"><span>${t('total')}${o.discount_label?' · '+esc(o.discount_label):''}</span><b>${fm(o.total)}</b></div>
    ${o.courier?`<p class="mut" style="font-size:13px">${t('courier')}: ${esc(o.courier)}${o.tracking_no?' · '+t('trackNo')+': '+esc(o.tracking_no):''}</p>`:''}
    <div style="margin-top:10px">${recv}</div>
    <div style="margin-top:10px">${evs.map(e=>`<div class="ev">${dt(e.at)} · ${t(e.status)}${e.note?' · '+esc(e.note):''}</div>`).join('')}</div>
  </div>`;
}

function paint(){
  const C=CACHE;if(!C)return;
  renderLoy(C.p);
  const un=C.nts.filter(n=>!n.read).length;
  $('#nts').innerHTML=C.nts.length
    ?(un?`<button class="btn g" data-mr="1" style="margin-bottom:8px">${t('markRead')} (${un})</button>`:'')
      +C.nts.map(n=>`<div class="n${n.read?'':' u'}"><b>${esc(LANG==='bn'?(n.title_bn||n.title_en):(n.title_en||n.title_bn))}</b><div class="mut">${esc(LANG==='bn'?(n.body_bn||n.body_en):(n.body_en||n.body_bn))}</div><small class="mut">${dt(n.at)}</small></div>`).join('')
    :`<p class="mut">${t('noMsgs')}</p>`;
  $('#ords').innerHTML=C.orders.length?C.orders.map(o=>orderCard(o,C)).join(''):`<p class="mut">${t('noOrders')}</p>`;
  if(C.p&&!filled){$('#nm').value=C.p.full_name||'';$('#ph').value=C.p.phone||'';filled=true}
}

async function loadAll(){
  if(!sb||!SESS||busy)return;busy=true;
  try{
    const uid=SESS.user.id;
    const [pr,od,nt]=await Promise.all([
      sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
      sb.from('orders').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
      sb.from('notifications').select('*').eq('audience','customer').eq('user_id',uid).order('at',{ascending:false}).limit(15)
    ]);
    if(od.error)throw od.error;
    const ids=(od.data||[]).map(o=>o.id);let items=[],events=[];
    if(ids.length){
      const [a,b]=await Promise.all([sb.from('order_items').select('*').in('order_id',ids),sb.from('order_events').select('*').in('order_id',ids)]);
      items=a.data||[];events=b.data||[];
    }
    CACHE={p:pr.data||null,orders:od.data||[],items:items,events:events,nts:nt.data||[]};
    $('#err').hidden=true;paint();
  }catch(e){$('#err').textContent=t('err');$('#err').hidden=false}
  busy=false;
}

function onSess(s){
  SESS=s;$('#login').hidden=!!s;$('#app').hidden=!s;$('#so').hidden=!s;
  if(!s){CACHE=null;filled=false;return}
  if(new URLSearchParams(location.search).get('next')==='checkout'){location.replace('../');return}
  loadAll();
}

S();
$('#lg').onclick=()=>{LANG=LANG==='bn'?'en':'bn';try{localStorage.setItem('aa_lang',LANG)}catch(e){}S();paint()};
if(!sb){$('#err').textContent=t('noCfg');$('#err').hidden=false;return}

async function doAuth(signup){
  const em=$('#em').value.trim(),pw=$('#pw').value,m=$('#lm');
  m.className='';m.textContent='';
  if(!/^\S+@\S+\.\S+$/.test(em)){m.className='er';m.textContent=t('badEmail');return}
  if(pw.length<6){m.className='er';m.textContent=t('badPass');return}
  $('#bl').disabled=true;$('#bs').disabled=true;
  let err=null;
  try{
    if(signup){
      const r=await sb.auth.signUp({email:em,password:pw});
      if(r.error){err=r.error}
      else if(!(r.data&&r.data.session)){
        const r2=await sb.auth.signInWithPassword({email:em,password:pw});
        if(r2.error){m.className='er';m.textContent=/confirm/i.test(r2.error.message)?t('confirmOn'):t('exists');$('#bl').disabled=false;$('#bs').disabled=false;return}
      }
    }else{
      const r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error)err=r.error;
    }
  }catch(e){err=e}
  $('#bl').disabled=false;$('#bs').disabled=false;
  if(err){
    const msg=String(err.message||'');
    m.className='er';
    m.textContent=/already|registered/i.test(msg)?t('exists'):/invalid|credentials/i.test(msg)?t('wrong'):/confirm/i.test(msg)?t('confirmOn'):t('fail');
  }
}
$('#lf').onsubmit=e=>{e.preventDefault();doAuth(false)};
$('#bs').onclick=()=>doAuth(true);
$('#so').onclick=async()=>{await sb.auth.signOut();onSess(null)};
$('#ords').onclick=async e=>{
  const b=e.target.closest('[data-recv]');if(!b)return;b.disabled=true;
  const r=await sb.rpc('confirm_received',{p_order:b.dataset.recv});
  if(r.error){b.disabled=false;alert(r.error.message);return}
  loadAll();
};
$('#nts').onclick=async e=>{
  if(!e.target.closest('[data-mr]'))return;
  await sb.from('notifications').update({read:true}).eq('audience','customer').eq('user_id',SESS.user.id).eq('read',false);
  loadAll();
};
$('#df').onsubmit=async e=>{
  e.preventDefault();
  const r=await sb.from('profiles').update({full_name:$('#nm').value.trim(),phone:$('#ph').value.trim()}).eq('id',SESS.user.id);
  const m=$('#dm');m.className=r.error?'er':'ok';m.textContent=r.error?t('err'):t('saved');
};
sb.auth.getSession().then(({data})=>onSess(data.session));
sb.auth.onAuthStateChange((_e,s)=>onSess(s));
setInterval(()=>{if(SESS&&!document.hidden)loadAll()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SESS)loadAll()});
})();
</script>
</body>
</html>
