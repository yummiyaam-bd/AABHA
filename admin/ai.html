<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0b11">
<title>AABHA | AI Assistant</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<style>
.aichat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.aimsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.aim{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word}
.aim.u{align-self:flex-end;background:linear-gradient(135deg,#e8b4a0,#b8715a);color:#fff;border-bottom-right-radius:4px}
.aim.b{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:4px}
.aim.err{color:#ff9aa8}
.aicp{display:block;margin-top:8px;background:none;border:1px solid rgba(255,255,255,.2);color:inherit;border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer}
.aichips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.aichips button{flex:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:inherit;border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.aibar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);align-items:flex-end}
.aibar textarea{flex:1;resize:none;max-height:110px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;color:inherit;padding:11px 14px;font:inherit;font-size:14px;outline:none}
.aibar button{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:18px;background:linear-gradient(135deg,#e8b4a0,#b8715a)}
.aibar button.mic{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.aibar button.mic.on{background:#d9778a;animation:aip 1s infinite}
.aibar button:disabled{opacity:.5}
@keyframes aip{50%{opacity:.5}}
.dots{display:inline-flex;gap:5px;align-items:center;height:20px;padding:0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#e8b4a0;display:block;animation:dj 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dj{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-7px);opacity:1}}
/* action confirm card */
.aact{margin-top:10px;padding:12px;border-radius:14px;background:rgba(232,180,160,.1);border:1px solid rgba(232,180,160,.35)}
.aact .t{font-size:13px;line-height:1.6;margin-bottom:10px}
.aact .w{font-size:12.5px;line-height:1.5;color:#ff9aa8;margin-bottom:10px}
.aact .r{display:flex;gap:8px}
.aact button{flex:1;border:0;border-radius:30px;padding:10px 14px;font:700 12px inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,#e8b4a0,#b8715a)}
.aact button.no{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.aact button:disabled{opacity:.5}
.aact .s{font-size:13px}
.err{color:#ff9aa8}
</style>
</head>
<body>
<div id="page">
  <section class="panel aichat">
    <div class="aimsgs" id="msgs">
      <div class="aim b">আসসালামু আলাইকুম! আমি আপনার AABHA সহকারী। বিক্রি, স্টক, লাভ-ক্ষতি, রিস্টক, দাম সাজেশন বা মেসেজ লেখা, যা খুশি জিজ্ঞেস করুন। স্টক, দাম, পণ্যের স্ট্যাটাস বা অর্ডারের স্ট্যাটাস বদলাতে বললে আমি আগে আপনার কনফার্মেশন চাইব।</div>
    </div>
    <div class="aichips" id="chips"></div>
    <div class="aibar">
      <button class="mic" id="mic" type="button" aria-label="Voice">🎤</button>
      <textarea id="q" rows="1" placeholder="প্রশ্ন লিখুন..."></textarea>
      <button id="send" type="button" aria-label="Send">➤</button>
    </div>
  </section>
</div>

<script>
const A=Admin, sb=A.sb, $=A.$, esc=A.esc;
const CHIPS=[
'আজ কয়টা অর্ডার, কত টাকার বিক্রি?',
'আজকের ডেইলি সামারি দাও',
'গতকালের বিক্রি কত?',
'কোন অর্ডারগুলো Pending?',
'বেস্টসেলার বিশ্লেষণ করো (টপ ৫)',
'রিস্টক সাজেশন দাও: কোন পণ্য কত পিস আনব?',
'কোন পণ্যের দাম কত করা উচিত?',
'এই মাসে নিট লাভ কত?',
'দেরির জন্য ক্ষমা চাওয়া মেসেজ লিখে দাও',
'একটা ডিসকাউন্ট আইডিয়া দাও'
];
const MEM=10;
let history=[], ctx=null, ctxAt=0, busy=false;
let stockRows=[], prodRows=[], orderRows=[];

const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PII=/^(customer_name|phone|address|email|user_id|full_name|customer_phone|customer_address)$/i;
const SKIP=/image|img|photo|picture|url|desc|html|gallery|thumb/i;
const clean=r=>{const o={};for(const k in r){const v=r[k];if(PII.test(k)||SKIP.test(k)||v==null)continue;if(typeof v==='string'&&v.length>120)continue;if(typeof v==='object'&&JSON.stringify(v).length>200)continue;o[k]=v}return o};

async function buildCtx(){
  if(ctx&&Date.now()-ctxAt<60000)return ctx;
  const since=new Date(Date.now()-60*864e5).toISOString();
  const [o,p,s,e]=await Promise.all([
    sb.from('orders').select('id,order_no,status,total,created_at,payment,discount_label,flags').gte('created_at',since).order('created_at',{ascending:false}).limit(600),
    sb.from('products').select('*'),
    sb.from('stock').select('product_id,size,color,qty,low_at'),
    sb.from('expenses').select('*').limit(300)
  ]);
  const orders=o.data||[], byId={};
  orders.forEach(x=>byId[x.id]=x);
  const ids=orders.map(x=>x.id), chunks=[];
  for(let i=0;i<ids.length;i+=100)chunks.push(ids.slice(i,i+100));
  const itemRes=await Promise.all(chunks.map(c=>sb.from('order_items').select('*').in('order_id',c)));
  const items=itemRes.flatMap(r=>r.data||[]).map(clean);

  const now=Date.now(), daily={};
  for(let i=0;i<45;i++){daily[dkey(now-i*864e5)]={orders:0,sales:0,delivered_sales:0}}
  orders.forEach(x=>{
    if(x.status==='cancelled')return;
    const d=daily[dkey(x.created_at)];if(!d)return;
    d.orders++;d.sales+=Number(x.total||0);
    if(x.status==='delivered')d.delivered_sales+=Number(x.total||0);
  });
  const status={};orders.forEach(x=>status[x.status]=(status[x.status]||0)+1);

  const sold={};
  items.forEach(it=>{
    const od=byId[it.order_id];if(!od||od.status==='cancelled')return;
    const age=(now-new Date(od.created_at))/864e5;
    const n=it.name||'?', k=sold[n]||(sold[n]={units_30d:0,units_7d:0,revenue_30d:0});
    const q=Number(it.qty||0), pr=Number(it.price??it.unit_price??0);
    if(age<=30){k.units_30d+=q;k.revenue_30d+=q*pr}
    if(age<=7)k.units_7d+=q;
  });
  const names={};(p.data||[]).forEach(x=>names[x.id]=x.name);
  stockRows=s.data||[];
  prodRows=p.data||[];
  orderRows=orders;
  ctx={
    today:dkey(now),
    note:'daily = last 45 days (local date). status_counts = last 60 days.',
    daily,status_counts:status,
    pending:orders.filter(x=>x.status==='pending').map(x=>({order_no:x.order_no,placed:x.created_at,total:x.total,flags:x.flags})),
    recent_orders:orders.slice(0,40).map(x=>({order_no:x.order_no,status:x.status,total:x.total,placed:x.created_at})),
    sold_by_product:sold,
    products:prodRows.map(clean),
    stock:stockRows.map(x=>({product:names[x.product_id]||x.product_id,size:x.size,color:x.color,qty:x.qty,low_at:x.low_at})),
    expenses:(e.data||[]).map(clean)
  };
  ctxAt=Date.now();
  return ctx;
}

function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function add(cls,html,raw){
  const d=document.createElement('div');d.className='aim '+cls;d.innerHTML=html;
  if(raw){const b=document.createElement('button');b.className='aicp';b.textContent='Copy';
    b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(raw);A.toast('Copy হয়েছে')};d.appendChild(b)}
  $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;return d;
}

/* ================= Action + Confirm ================= */
const PRICE_COLS=['price','sale_price','selling_price'];
const COST_COLS=['cost','cost_price','buy_price','buying_price','purchase_price'];
const STATUS_COLS=['status','is_active','active'];
const findCol=(row,list)=>list.find(c=>c in row);
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const prodRow=n=>prodRows.find(x=>same(x.name,n));
const taka=n=>'৳'+Number(n).toLocaleString('en-US');
const RANK={pending:0,confirmed:1,shipped:2,delivered:3};

async function upd(table,patch,filters){
  let u=sb.from(table).update(patch);
  for(const [k,v] of filters)u=v===null?u.is(k,null):u.eq(k,v);
  const {data,error}=await u.select();
  if(error)throw error;
  if(!data||!data.length)throw new Error('আপডেট হয়নি (permission/RLS চেক করুন)');
  return data;
}

const ACT_RE=/ACTION:\s*(\{[\s\S]*?\})\s*$/;
function splitAction(ans){
  const m=ans.match(ACT_RE);
  if(m){let a=null;try{a=JSON.parse(m[1])}catch(_){}return{text:ans.slice(0,m.index).trim(),action:a}}
  const i=ans.indexOf('ACTION:');
  return{text:(i>=0?ans.slice(0,i):ans).trim(),action:null};
}

// AI-র প্রস্তাব আসল ডেটার সাথে মিলিয়ে নেয়। সব ঠিক থাকলে {title,warn,apply,mem} ফেরত দেয়।
function resolveAction(a){
  if(!a||!a.type)return{error:'অ্যাকশনটা বোঝা যায়নি'};

  if(a.type==='set_stock'){
    const p=prodRow(a.product);
    if(!p)return{error:'পণ্য খুঁজে পাইনি: '+(a.product||'?')};
    const qty=Number(a.qty);
    if(!Number.isInteger(qty)||qty<0||qty>100000)return{error:'সংখ্যাটা ঠিক না'};
    let rows=stockRows.filter(r=>r.product_id===p.id&&same(r.size,a.size));
    if(a.color)rows=rows.filter(r=>same(r.color,a.color));
    if(rows.length===0)return{error:'ওই সাইজ/রং-এর স্টক রো পাইনি'};
    if(rows.length>1)return{error:'একাধিক রো মিলেছে, রংসহ বলুন'};
    const row=rows[0], label=esc(p.name)+' · '+esc(row.size)+(row.color?' · '+esc(row.color):'');
    return{
      title:'স্টক বদলাবো?<br><b>'+label+'</b><br>'+esc(row.qty)+' → <b>'+qty+'</b>',
      apply:async()=>{
        await upd('stock',{qty},[['product_id',row.product_id],['size',row.size],['color',row.color==null?null:row.color]]);
        row.qty=qty;return 'স্টক: '+label+' → '+qty;
      },
      mem:p.name+' '+row.size+' এর স্টক এখন '+qty+'।'
    };
  }

  if(a.type==='set_price'){
    const p=prodRow(a.product);
    if(!p)return{error:'পণ্য খুঁজে পাইনি: '+(a.product||'?')};
    const pc=findCol(p,PRICE_COLS);
    if(!pc)return{error:'দামের কলাম পাইনি (products টেবিলে price নামে কলাম লাগবে)'};
    const np=Number(a.price), old=Number(p[pc]);
    if(!(np>0)||np>10000000)return{error:'দামটা ঠিক না'};
    if(old>0&&Math.abs(np-old)/old>0.5)return{error:'দাম ৫০%-এর বেশি বদলানো AI দিয়ে করা যায় না। Products পেজ থেকে করুন।'};
    const cc=findCol(p,COST_COLS), cost=cc?Number(p[cc]):0;
    const warn=(cost>0&&np<=cost)?'⚠️ নতুন দাম কেনা দামের ('+taka(cost)+') সমান বা কম, লস হবে!':'';
    return{
      title:'দাম বদলাবো?<br><b>'+esc(p.name)+'</b><br>'+taka(old)+' → <b>'+taka(np)+'</b><br><small>কলাম: '+esc(pc)+'</small>',
      warn,
      apply:async()=>{await upd('products',{[pc]:np},[['id',p.id]]);p[pc]=np;return 'দাম: '+esc(p.name)+' → '+taka(np)},
      mem:p.name+' এর দাম এখন '+taka(np)+'।'
    };
  }

  if(a.type==='set_status'){
    const p=prodRow(a.product);
    if(!p)return{error:'পণ্য খুঁজে পাইনি: '+(a.product||'?')};
    const sc=findCol(p,STATUS_COLS);
    if(!sc)return{error:'স্ট্যাটাসের কলাম পাইনি (status / is_active / active)'};
    const want=String(a.status||'').toLowerCase();
    if(want!=='active'&&want!=='inactive')return{error:'স্ট্যাটাস শুধু active বা inactive হতে পারে'};
    const act=want==='active', cur=p[sc];
    let val;
    if(typeof cur==='boolean')val=act;
    else if(typeof cur==='string'&&/^[A-Z]/.test(cur))val=act?'Active':'Inactive';
    else val=act?'active':'inactive';
    return{
      title:'পণ্যের স্ট্যাটাস বদলাবো?<br><b>'+esc(p.name)+'</b><br>'+esc(cur)+' → <b>'+esc(val)+'</b><br><small>কলাম: '+esc(sc)+'</small>',
      warn:act?'':'⚠️ Inactive করলে পণ্যটা ওয়েবসাইটে আর দেখা নাও যেতে পারে।',
      apply:async()=>{await upd('products',{[sc]:val},[['id',p.id]]);p[sc]=val;return 'স্ট্যাটাস: '+esc(p.name)+' → '+esc(val)},
      mem:p.name+' এখন '+val+'।'
    };
  }

  if(a.type==='set_order_status'){
    const od=orderRows.find(o=>same(o.order_no,a.order_no));
    if(!od)return{error:'অর্ডার পাইনি: '+(a.order_no||'?')+' (শুধু গত ৬০ দিনের অর্ডার)'};
    const to=String(a.status||'').toLowerCase(), from=String(od.status||'').toLowerCase();
    if(to==='cancelled')return{error:'বাতিল করা AI দিয়ে হয় না। আগের মতো নিজে বাতিল করুন, যাতে স্টকের হিসাব ঠিক থাকে।'};
    if(!(to in RANK)||to==='pending')return{error:'স্ট্যাটাস শুধু confirmed, shipped বা delivered হতে পারে'};
    if(from==='delivered'||from==='cancelled')return{error:'ডেলিভারড বা বাতিল অর্ডার আর বদলানো যায় না'};
    if(from===to)return{error:'অর্ডারটা আগে থেকেই '+to+' আছে'};
    if(from in RANK&&RANK[to]<=RANK[from])return{error:'অর্ডার পেছনের ধাপে নেওয়া যায় না'};
    return{
      title:'অর্ডারের স্ট্যাটাস বদলাবো?<br><b>'+esc(od.order_no)+'</b> ('+taka(od.total||0)+')<br>'+esc(from)+' → <b>'+esc(to)+'</b>',
      warn:to==='delivered'?'⚠️ Delivered করলে আর ফেরানো যাবে না।':'',
      apply:async()=>{await upd('orders',{status:to},[['id',od.id]]);od.status=to;return 'অর্ডার '+esc(od.order_no)+' → '+esc(to)},
      mem:'অর্ডার '+od.order_no+' এখন '+to+'।'
    };
  }

  return{error:'এই অ্যাকশন এখনো সাপোর্ট করে না'};
}

function actionCard(parent,a){
  const r=resolveAction(a), card=document.createElement('div');card.className='aact';
  if(r.error){card.innerHTML='<div class="s err">⚠️ '+esc(r.error)+'</div>';parent.appendChild(card);return}
  card.innerHTML='<div class="t">'+r.title+'</div>'+(r.warn?'<div class="w">'+r.warn+'</div>':'')+
    '<div class="r"><button class="ok" type="button">✔ Confirm</button><button class="no" type="button">✖ Cancel</button></div>';
  const ok=card.querySelector('.ok'), no=card.querySelector('.no');
  no.onclick=()=>{card.innerHTML='<div class="s">বাতিল করা হয়েছে।</div>'};
  ok.onclick=async()=>{
    ok.disabled=no.disabled=true;
    try{
      const msg=await r.apply();
      ctx=null;
      card.innerHTML='<div class="s">✅ হয়ে গেছে: '+msg+'</div>';
      history.push({role:'user',text:'(আমি কনফার্ম করেছি, আপডেট হয়েছে)'},{role:'model',text:r.mem});
      A.toast('আপডেট হয়েছে');
    }catch(err){
      card.innerHTML='<div class="s err">সমস্যা: '+esc(err.message||err)+'</div>';
    }
  };
  parent.appendChild(card);
  $('msgs').scrollTop=$('msgs').scrollHeight;
}

/* ================= Ask ================= */
async function ask(text){
  text=(text||'').trim();if(!text||busy)return;
  busy=true;$('send').disabled=true;$('q').value='';$('q').style.height='auto';
  add('u',esc(text));
  const w=add('b','<span class="dots"><i></i><i></i><i></i></span>');
  try{
    const [context,ses]=await Promise.all([buildCtx(),sb.auth.getSession()]);
    const tok=ses.data.session.access_token;
    const url=(sb.supabaseUrl||'https://xjwuozdfuflfoqiuucik.supabase.co')+'/functions/v1/smooth-processor';
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':sb.supabaseKey||'sb_publishable_vyOh8uTL-GUcuPD4PevQ5w_qIbNJ8fm'},body:JSON.stringify({question:text,history:history.slice(-MEM),context})});
    if(!res.ok){let m='';try{const tx=await res.text();try{const jj=JSON.parse(tx);m=jj.error||jj.message||tx}catch(_){m=tx}}catch(_){}throw new Error((m||'error')+' (code '+res.status+')')}
    const rd=res.body.getReader(),dec=new TextDecoder();let ans='';
    while(true){const r=await rd.read();if(r.done)break;ans+=dec.decode(r.value,{stream:true});w.innerHTML=fmt(splitAction(ans).text);$('msgs').scrollTop=$('msgs').scrollHeight}
    if(!ans.trim())throw new Error('খালি উত্তর এসেছে');
    const sp=splitAction(ans);
    w.innerHTML=fmt(sp.text||'ঠিক আছে।');
    const cb=document.createElement('button');cb.className='aicp';cb.textContent='Copy';
    cb.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(sp.text);A.toast('Copy হয়েছে')};w.appendChild(cb);
    if(sp.action)actionCard(w,sp.action);
    history.push({role:'user',text:text},{role:'model',text:sp.text||ans});
  }catch(err){
    w.remove();add('b err','সমস্যা হয়েছে: '+esc(err.message||err));
  }
  busy=false;$('send').disabled=false;
}

/* ================= সকালের সামারি + কম স্টক ================= */
async function showBrief(){
  try{
    const {data}=await sb.from('ai_briefs').select('day,body').order('day',{ascending:false}).limit(1);
    if(data&&data[0])add('b','🌅 <b>সকালের সামারি ('+esc(data[0].day)+')</b>\n'+fmt(data[0].body),data[0].body);
  }catch(_){}
}
async function showLow(){
  try{
    await buildCtx();
    const low=stockRows.filter(r=>Number(r.qty)<=Number(r.low_at??3));
    if(!low.length)return;
    const d=add('b','⚠️ <b>'+low.length+' টি সাইজের স্টক কম</b>');
    const b=document.createElement('button');b.className='aicp';b.textContent='🤖 রিস্টক সাজেশন নাও';
    b.onclick=()=>ask('কম স্টকের সাইজগুলোর জন্য রিস্টক সাজেশন দাও');d.appendChild(b);
  }catch(_){}
}

function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, m=$('mic');
  if(!SR){m.style.display='none';return}
  const r=new SR();r.lang='bn-BD';r.interimResults=false;
  r.onresult=ev=>{const t=ev.results[0][0].transcript;$('q').value=t;ask(t)};
  r.onend=()=>m.classList.remove('on');
  r.onerror=()=>m.classList.remove('on');
  m.onclick=()=>{if(m.classList.contains('on')){r.stop();return}m.classList.add('on');try{r.start()}catch(e){m.classList.remove('on')}};
}

Admin.boot({key:'ai',title:'AI Assistant',perm:'reports',ready:async()=>{
  $('chips').innerHTML=CHIPS.map(c=>`<button type="button">${esc(c)}</button>`).join('');
  $('chips').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.textContent)};
  $('send').onclick=()=>ask($('q').value);
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask($('q').value)}});
  $('q').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'});
  setupMic();
  showBrief().then(showLow);
  A.onRefresh=()=>{ctx=null;A.toast('ডেটা রিফ্রেশ হবে')};
}});
</script>
