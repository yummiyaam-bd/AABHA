<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AABHA | OMNI AI</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<style>
/* OMNI AI: শুধু এই পেজের ভেতরে প্রযোজ্য, বাকি admin অক্ষত */
.om{--p1:#7c5cf0;--p2:#a78bfa;--bl:#dbeafe;--pk:#fce7f3;--pe:#ffedd5;--bd:rgba(124,92,240,.14);
 padding:18px;border-radius:26px;background:linear-gradient(135deg,#ece8ff,#f6ecfb 45%,#e7f0ff 75%,#fff1e8);border:1px solid var(--bd)}
.om *{box-sizing:border-box}
.om-tabs{display:inline-flex;gap:4px;padding:5px;border-radius:40px;background:rgba(255,255,255,.7);margin-bottom:16px}
.om-tabs button{border:0;background:transparent;padding:10px 20px;border-radius:30px;font:700 13px var(--sans);color:#5b5675;cursor:pointer;transition:.25s}
.om-tabs button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 8px 20px rgba(124,92,240,.3)}
.om-g{display:grid;grid-template-columns:280px minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.om-c{background:rgba(255,255,255,.72);border:1px solid var(--bd);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(124,92,240,.08);min-width:0}
.om-c h3{margin:0 0 12px;font:600 1.15rem var(--serif)}

.ag{border:1px solid var(--bd);border-radius:16px;padding:11px 12px;margin-bottom:8px;background:#fff;cursor:pointer;transition:.25s}
.ag:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(124,92,240,.12)}
.ag-h{display:flex;gap:10px;align-items:center}.ag-i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--bl);flex:none}
.ag:nth-child(2n) .ag-i{background:var(--pk)}.ag:nth-child(3n) .ag-i{background:var(--pe)}
.ag b{display:block;font-size:13.5px}.ag small{color:var(--mut);font-size:11.5px}
.ag-s{margin-left:auto;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:12px;background:#dcfce7;color:#15803d;white-space:nowrap}
.ag-s.w{background:#fef3c7;color:#b45309}.ag-s.x{background:#eee;color:#777}
.ag-d{display:none;margin-top:10px;font-size:12px;color:#5b5675;line-height:1.5}.ag.open .ag-d{display:block}
.ag-d p{margin:0 0 4px}
.orb{width:84px;height:84px;margin:4px auto 10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#c4b5fd 35%,#7c5cf0 70%,#f0abfc);box-shadow:0 14px 40px rgba(124,92,240,.35);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) scale(1.03)}}
.hi{text-align:center;margin-bottom:10px}.hi h2{margin:0;font:600 1.5rem var(--serif)}.hi p{margin:4px 0 0;color:var(--mut);font-size:13px}
.msgs{max-height:340px;overflow-y:auto;padding:4px 2px}
.mg{max-width:88%;padding:10px 14px;border-radius:16px;margin:7px 0;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.mg.u{margin-left:auto;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}.mg.a{background:#fff;border:1px solid var(--bd)}
.mg.t{opacity:.6}
.qa{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.qa button{border:1px solid var(--bd);background:#fff;border-radius:30px;padding:8px 14px;font:600 12px var(--sans);color:#4b4670;cursor:pointer;transition:.25s}
.qa button:hover{background:var(--bl);border-color:var(--p2)}
.inp{display:flex;gap:8px;margin-top:10px}
.inp input{flex:1;border:1px solid var(--bd);border-radius:30px;padding:12px 16px;font:500 14px var(--sans);background:#fff;outline:none}.inp input:focus{border-color:var(--p2)}
.inp button{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:18px;cursor:pointer}
.vc{text-align:center}.vc[hidden],.ch[hidden]{display:none}
.mic{position:relative;width:128px;height:128px;margin:10px auto;border-radius:50%;border:0;font-size:46px;color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,#a78bfa,#6d49e8);box-shadow:0 0 0 14px rgba(124,92,240,.12),0 0 0 30px rgba(124,92,240,.07),0 18px 40px rgba(124,92,240,.4);transition:.3s}
.mic.on{animation:pu 1.2s infinite}@keyframes pu{50%{transform:scale(1.07)}}
.wv{display:flex;gap:3px;align-items:center;justify-content:center;height:46px;margin:6px 0}
.wv i{width:4px;height:8px;border-radius:3px;background:linear-gradient(var(--p2),var(--p1));opacity:.45}
.wv.on i{opacity:1;animation:wv .9s ease-in-out infinite;animation-delay:var(--d)}@keyframes wv{50%{height:40px}}
.vt{font:600 1.1rem var(--serif);margin:4px 0}.vs{color:var(--mut);font-size:13px}
.tr{margin:12px 0;padding:12px 14px;border-radius:16px;background:var(--pk);font-size:14px;min-height:46px;text-align:left}
.vsay{margin:8px 0;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--bd);font-size:14px;text-align:left;min-height:46px;white-space:pre-wrap}
.vr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;margin-top:8px;align-items:center}
.vr button,.vr select{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 12px;font:600 12px var(--sans);cursor:pointer}
.wsh{display:flex;justify-content:space-between;align-items:center}.wsh button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:5px 12px;font:600 11px var(--sans);cursor:pointer}
#ws{display:grid;gap:12px;max-height:78vh;overflow-y:auto}
.wb{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:14px;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.wb h4{margin:0 0 10px;font:600 1rem var(--serif)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.st div{padding:11px;border-radius:14px;background:linear-gradient(135deg,var(--bl),var(--pk))}.st small{display:block;font-size:10.5px;color:#5b5675;letter-spacing:.04em}
.st b{display:block;font:600 1.35rem var(--serif);margin-top:3px}.st em{font-style:normal;font-size:11px;font-weight:800}.st em.up{color:#15803d}.st em.dn{color:#be123c}
.ct{display:flex;gap:4px;align-items:flex-end;height:150px}.ct div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ct i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(var(--p2),var(--p1));min-height:2px;transition:height .8s}.ct i.f{background:repeating-linear-gradient(45deg,#d8ccff,#d8ccff 4px,#efe9ff 4px,#efe9ff 8px)}
.ct span{font-size:8.5px;color:var(--mut);margin-top:4px}
.wt{overflow-x:auto}.wt table{min-width:0;width:100%}.wt th{background:transparent}.wt td,.wt th{padding:9px 8px;font-size:12.5px}
.empty2{text-align:center;color:var(--mut);padding:30px 10px;font-size:13px}
@media(max-width:1100px){.om-g{grid-template-columns:minmax(0,1fr)}.om-ag{display:none}.om[data-m=agent] .om-ag{display:block}.om[data-m=agent][data-sel="1"] .om-ag{display:none}.om[data-m=agent][data-sel="0"] .om-mid,.om[data-m=agent][data-sel="0"] #wsc{display:none}.om{padding:12px}}
@media(min-width:1101px){.abk{display:none}}
[hidden]{display:none!important}.om{overflow-x:hidden}.om-c{min-width:0}.vr select,#vsel{width:100%;max-width:100%}
.ag.sel{border-color:var(--p1);box-shadow:0 0 0 2px rgba(124,92,240,.18)}
.abk{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 14px;font:700 12px var(--sans);cursor:pointer;margin-bottom:10px}
.ah{display:flex;gap:12px;align-items:center}.ad{color:#5b5675;font-size:13px;margin:8px 0}.hh{margin:14px 0 6px;font:600 1rem var(--serif)}.lg p{margin:3px 0;font-size:12.5px}
</style>
</head>
<body>
<div id="page">
<div class="om" id="om" data-m="chat" data-sel="0">
  <div class="om-tabs" id="tabs"><button data-m="voice">🎙 Voice Mode</button><button data-m="chat" class="on">💬 Chat Mode</button><button data-m="agent">🤖 Agent Mode</button></div>
  <div class="om-g">
    <aside class="om-c om-ag"><h3>AI Agents</h3><div id="ags"></div></aside>
    <main class="om-c om-mid">
      <section class="vc" id="v-voice" hidden>
        <div class="vt" id="vt">কথা বলতে মাইকে চাপুন</div><div class="vs">বাংলা, English বা মিশ্র ভাষায় বলুন</div>
        <button class="mic" id="mic" aria-label="mic">🎙</button>
        <div class="wv" id="wv"></div>
        <div class="tr" id="tr">লাইভ ট্রান্সক্রিপশন এখানে দেখাবে…</div>
        <div class="vsay" id="vsay">OMNI-র উত্তর এখানে আসবে…</div>
        <div class="vr">
          <select id="vsel" style="max-width:190px"></select><button id="vtest">🔈 টেস্ট</button><label><input type="checkbox" id="spk" checked> 🔊 উত্তর শোনাও</label><button id="stopsp">⏹ থামাও</button></div>
      </section>
      <section class="ch" id="v-chat">
        <div class="orb"></div>
        <div class="hi"><h2 id="gr">Good Morning</h2><p>আজ কী জানতে চান? বিক্রি, স্টক, অর্ডার, আয়-ব্যয় বা ভবিষ্যৎ অনুমান।</p></div>
        <div class="msgs" id="msgs"></div>
      </section>
      <section id="v-agent" hidden></section>
      <div class="qa" id="qa"></div>
      <div class="inp" id="gin"><input id="ti" placeholder="যেকোনো কিছু জিজ্ঞেস করুন…" autocomplete="off"><button id="sd" aria-label="send">➤</button></div>
    </main>
    <aside class="om-c" id="wsc"><div class="wsh"><h3>Live Workspace</h3><button id="clr">মুছুন</button></div><div id="ws"><div class="empty2">প্রশ্ন করলে চার্ট, টেবিল ও কার্ড এখানে দেখাবে।</div></div></aside>
  </div>
</div>
</div>
<script>
const A=Admin,sb=A.sb,$=A.$,esc=A.esc;
const AG=[
['ceo','👑','CEO Agent','Business Coordinator','সব এজেন্টের কাজ সমন্বয় করে, পুরো ব্যবসার সারাংশ দেয়',['আজকের বিক্রি দেখাও','কম স্টকের পণ্য দেখাও','এই মাসের আয়-ব্যয় কেমন?','আগামী ৭ দিনে কত বিক্রি হতে পারে?']],
['sales','📈','Sales Agent','Sales & Growth','বিক্রি, অর্ডার ও ভবিষ্যৎ অনুমান',['আজকের বিক্রি দেখাও','গত ৭ দিনের বিক্রি','গত ৩০ দিনের বিক্রি','সাম্প্রতিক অর্ডার দেখাও','আগামী ৭ দিনে কত বিক্রি হতে পারে?']],
['inv','📦','Inventory Agent','Stock Management','স্টক ও সেরা বিক্রিত পণ্য',['কম স্টকের পণ্য দেখাও','স্টক শেষ হয়ে গেছে এমন পণ্য','সেরা বিক্রিত পণ্য']],
['fin','🧾','Finance Agent','Finance & Accounts','আয়, ব্যয়, লাভ-ক্ষতি',['এই মাসের আয়-ব্যয় কেমন?','লাভ কত হয়েছে?']],
['mkt','📣','Marketing Agent','Marketing Strategy','ফেলে যাওয়া কার্ট ও ক্যাম্পেইনের ধারণা',['ফেলে যাওয়া কার্ট','ফেলে যাওয়া কার্টের গ্রাহকদের জন্য ক্যাম্পেইনের ধারণা দাও']],
['sup','🎧','Customer Support Agent','Customer Care','গ্রাহকের মেসেজ ও সাপোর্ট (শীঘ্রই আসছে)',[]]];
const TA={sales_summary:'sales',sales_forecast:'sales',recent_orders:'sales',low_stock:'inv',top_products:'inv',finance_summary:'fin',abandoned_carts:'mkt'};
const QA=['আজকের বিক্রি দেখাও','কম স্টকের পণ্য দেখাও','সাম্প্রতিক অর্ডার দেখাও','এই মাসের আয়-ব্যয় কেমন?','ফেলে যাওয়া কার্ট','আগামী ৭ দিনে কত বিক্রি হতে পারে?','সেরা বিক্রিত পণ্য'];
const HIST=[],HA={},AS={},LOG={};let busy=false,rec=null,listening=false,fin='',SEL=null;
AG.forEach(a=>{AS[a[0]]=a[0]==='sup'?'x':'';LOG[a[0]]=[]});
const gH=ag=>ag==='ceo'?HIST:(HA[ag]||(HA[ag]=[]));

function drawAg(){$('ags').innerHTML=AG.map(a=>{const s=AS[a[0]];return `<div class="ag${SEL===a[0]?' sel':''}" data-a="${a[0]}"><div class="ag-h"><div class="ag-i">${a[1]}</div><div><b>${a[2]}</b><small>${a[3]}</small></div><span class="ag-s ${s}">${s==='x'?'Soon':s==='w'?'Working…':'Ready'}</span></div></div>`}).join('')}
function setAg(ids,s){ids.forEach(i=>{if(AS[i]!=='x')AS[i]=s});drawAg()}
$('ags').onclick=e=>{const c=e.target.closest('.ag');if(c){setMode('agent');selAg(c.dataset.a)}};
function selAg(id){SEL=id;$('om').dataset.sel='1';drawAg();renderAgent()}
function renderAgent(){const a=AG.find(x=>x[0]===SEL),box=$('v-agent');
 if(!a){box.innerHTML='<div class="empty2">বাঁ পাশ থেকে একটি এজেন্ট বেছে নিন।</div>';return}
 const soon=a[0]==='sup';
 box.innerHTML=`<button class="abk" id="abk">← সব এজেন্ট</button><div class="ah"><div class="ag-i" style="width:52px;height:52px;font-size:26px">${a[1]}</div><div><h3 style="margin:0">${a[2]}</h3><small class="sub">${a[3]} · ${soon?'শীঘ্রই আসছে':'প্রস্তুত'}</small></div></div>
 <p class="ad">${a[4]}</p>
 <div class="qa" id="aqa">${a[5].map(q=>'<button>'+esc(q)+'</button>').join('')}</div>
 <div class="msgs" id="amsgs"></div>
 <div class="inp"><input id="ati" placeholder="${soon?'এই এজেন্ট শীঘ্রই আসছে':esc(a[2])+'-কে জিজ্ঞেস করুন…'}" ${soon?'disabled':''} autocomplete="off"><button id="asd" ${soon?'disabled':''}>➤</button></div>
 <h4 class="hh">সর্বশেষ কাজ</h4><div class="lg">${LOG[a[0]].length?LOG[a[0]].slice(0,6).map(x=>'<p>• '+esc(x)+'</p>').join(''):'<p class="sub">এখনো কোনো কাজ নেই</p>'}</div>`;
 gH(a[0]).forEach(m=>addMsg(m.role==='user'?'u':'a',m.content,$('amsgs')));
 $('abk').onclick=()=>{SEL=null;$('om').dataset.sel='0';drawAg();renderAgent()};
 $('aqa').onclick=e=>{const b=e.target.closest('button');if(b)send(b.textContent,a[0])};
 if(!soon){$('asd').onclick=()=>send($('ati').value,a[0]);$('ati').onkeydown=e=>{if(e.key==='Enter')send($('ati').value,a[0])}}}

function setMode(m){$('om').dataset.m=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 const ag=m==='agent';$('v-voice').hidden=m!=='voice';$('v-chat').hidden=m!=='chat';$('qa').hidden=ag;$('gin').hidden=ag;$('v-agent').hidden=!ag;
 if(ag){if(!SEL)$('om').dataset.sel='0';renderAgent()}
 if(m!=='voice')stopAudio()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};

function addMsg(c,t,box){box=box||$('msgs');const d=document.createElement('div');d.className='mg '+c;d.textContent=t;box.appendChild(d);box.scrollTop=1e6;return d}
function blk(b){let h='<div class="wb"><h4>'+esc(b.title||'')+'</h4>';
 if(b.type==='stats')h+='<div class="st">'+b.items.map(i=>`<div><small>${esc(i.l)}</small><b>${esc(i.v)}</b>${i.d?`<em class="${i.d[0]==='-'?'dn':'up'}">${esc(i.d)}</em>`:''}</div>`).join('')+'</div>';
 else if(b.type==='chart'){const mx=Math.max(1,...b.values);h+='<div class="ct">'+b.values.map((v,i)=>`<div title="${esc(b.labels[i])}: ${A.money(v)}"><i class="${b.fc!=null&&i>=b.fc?'f':''}" style="height:${v?Math.max(3,v/mx*100):0}%"></i><span>${esc(b.labels[i])}</span></div>`).join('')+'</div>'}
 else if(b.type==='table')h+=b.rows.length?'<div class="wt"><table><thead><tr>'+b.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty2">কোনো তথ্য নেই।</div>';
 return h+'</div>'}
function showBlocks(bs){const w=$('ws');if(w.querySelector('.empty2'))w.innerHTML='';w.insertAdjacentHTML('afterbegin',bs.slice().reverse().map(blk).join(''));w.scrollTop=0}
$('clr').onclick=()=>{$('ws').innerHTML='<div class="empty2">প্রশ্ন করলে চার্ট, টেবিল ও কার্ড এখানে দেখাবে।</div>'};

const FEM=/female|woman|zira|samantha|susan|hazel|aria|jenny|sonia|libby|nabanita|tanishaa|sangeeta|heera|neerja|swara|google/i,MAL=/\bmale\b|david|mark|george|ravi|prabhat|pradeep|bashkar|guy|ryan|christopher/i;
let VS=[];const isBn=l=>/^bn/i.test(l);
function loadV(){if(!window.speechSynthesis)return;VS=speechSynthesis.getVoices().filter(v=>/^(bn|en)/i.test(v.lang))}
function pick(bn){const pool=VS.filter(v=>isBn(v.lang)===bn);return pool.find(v=>FEM.test(v.name)&&!MAL.test(v.name))||pool.find(v=>!MAL.test(v.name))||pool[0]||null}
const clean=t=>String(t).replace(/৳\s?([\d,\.]+)/g,'$1 টাকা').replace(/[*_#`>|~]/g,' ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s*\n+\s*/g,'। ').trim();
let AUD=null;
let SAYTOK=0;
function stopAudio(){SAYTOK++;const a=AUD;AUD=null;if(a){try{a.pause()}catch(e){}a._r&&a._r()}if(window.speechSynthesis)speechSynthesis.cancel()}
function bsay(t){if(!window.speechSynthesis)return;
 (t.match(/[^।.!?]+[।.!?]*/g)||[t]).forEach(p=>{p=p.trim();if(!p)return;const bn=/[\u0980-\u09FF]/.test(p),u=new SpeechSynthesisUtterance(p),v=pick(bn);u.lang=bn?'bn-BD':'en-US';if(v){u.voice=v;u.lang=v.lang}u.rate=1.12;u.pitch=1.08;speechSynthesis.speak(u)})}
async function ttsGet(t){
 const r=await sb.functions.invoke('omni-ai',{body:{tts:t,voice:$('vsel').value}});
 if(r.error){let m=r.error.message;try{const x=await r.error.context.text();try{m=JSON.parse(x).error||x}catch(_){m=x||m}}catch(_){}throw new Error(m)}
 if(!r.data||r.data.error||!r.data.audio)throw new Error((r.data&&r.data.error)||'অডিও আসেনি');
 const bin=atob(r.data.audio),n=bin.length,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,x)=>{for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,24000,true);v.setUint32(28,48000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n,true);
 const u8=new Uint8Array(buf,44);for(let i=0;i<n;i++)u8[i]=bin.charCodeAt(i);
 return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
function playUrl(url){return new Promise((res,rej)=>{const a=new Audio(url);a.playbackRate=1.1;a._r=res;AUD=a;a.onended=()=>res();a.onerror=()=>rej(new Error('অডিও চলেনি'));a.play().catch(rej)})}
async function say(t){stopAudio();t=clean(t);if(!t)return;const tok=SAYTOK;
 const sn=(t.match(/[^।.!?]+[।.!?]*/g)||[t]).map(x=>x.trim()).filter(Boolean);
 const parts=sn.length>1?[sn[0],sn.slice(1).join(' ')]:[t];
 const ps=parts.map(p=>ttsGet(p.slice(0,800)));ps.forEach(p=>p.catch(()=>{}));
 let i=0;
 try{for(;i<ps.length;i++){const url=await ps[i];if(tok!==SAYTOK)return;await playUrl(url);if(tok!==SAYTOK)return}}
 catch(e){if(tok!==SAYTOK)return;console.log('tts',e);A.toast('উন্নত কণ্ঠ চলেনি ('+String(e.message).slice(0,70)+'), সাধারণ কণ্ঠে বলছি');bsay(parts.slice(i).join(' '))}}

$('vsel').innerHTML=[['Kore','মেয়ের কণ্ঠ: কোর (স্পষ্ট)'],['Zephyr','মেয়ের কণ্ঠ: জেফির (উজ্জ্বল)'],['Leda','মেয়ের কণ্ঠ: লেডা (কোমল)'],['Aoede','মেয়ের কণ্ঠ: আয়োডি (হালকা)']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
try{const g=localStorage.getItem('omni_gv');if(g)$('vsel').value=g}catch(e){}
$('vsel').onchange=()=>{try{localStorage.setItem('omni_gv',$('vsel').value)}catch(e){}};

async function send(t,ag){ag=ag||'ceo';t=String(t||'').trim();if(!t||busy)return;busy=true;
 const agentUI=$('om').dataset.m==='agent'&&SEL===ag&&ag!=='sup',box=agentUI?$('amsgs'):$('msgs');
 if(agentUI)$('ati').value='';else $('ti').value='';
 const H=gH(ag);addMsg('u',t,box);H.push({role:'user',content:t});const th=addMsg('a t','ভাবছি…',box);
 if(!agentUI)$('vsay').textContent='ভাবছি…';setAg([ag],'w');let ok=false;
 try{const r=await Promise.race([sb.functions.invoke('omni-ai',{body:{messages:H.slice(-12),agent:ag,mode:$('om').dataset.m}}),new Promise((_,rj)=>setTimeout(()=>rj(new Error('৭০ সেকেন্ডে উত্তর আসেনি। Supabase → Edge Functions → omni-ai → Logs দেখুন।')),70000))]);
  if(r.error){let m=r.error.message||'অজানা সমস্যা';try{const x=await r.error.context.text();try{const j=JSON.parse(x);m=j.error||j.message||x}catch(_){m=x||m}}catch(_){}throw new Error(m)}
  if(!r.data||r.data.error)throw new Error((r.data&&r.data.error)||'খালি উত্তর এসেছে');
  const d=r.data;th.className='mg a';th.textContent=d.reply||'(উত্তর নেই)';if(!agentUI)$('vsay').textContent=d.reply||'';H.push({role:'assistant',content:d.reply||''});
  const ags=[...new Set((d.used||[]).map(u=>TA[u]).filter(Boolean))],ent=t.slice(0,60)+' — '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(ag==='ceo'){ags.forEach(i=>LOG[i].unshift(ent));if(ags.length>1)LOG.ceo.unshift('সমন্বয়: '+ags.length+' এজেন্ট — '+t.slice(0,40))}else LOG[ag].unshift(ent);
  if(d.blocks&&d.blocks.length)showBlocks(d.blocks);
  if(d.reply&&$('om').dataset.m==='voice')speak(d.reply);ok=true;
 }catch(e){th.className='mg a';th.textContent='⚠️ '+e.message;if(!agentUI)$('vsay').textContent=th.textContent;H.pop()}
 busy=false;setAg(AG.map(a=>a[0]),'');if(ok&&agentUI&&SEL===ag)renderAgent()}
$('sd').onclick=()=>send($('ti').value);$('ti').onkeydown=e=>{if(e.key==='Enter')send($('ti').value)};
$('qa').innerHTML=QA.map(q=>'<button>'+esc(q)+'</button>').join('');$('qa').onclick=e=>{const b=e.target.closest('button');if(b)send(b.textContent)};

/* ভয়েস ইনপুট: মাইকে রেকর্ড করে Gemini দিয়ে লেখায় রূপান্তর (সব ব্রাউজারে চলে) */
$('wv').innerHTML=Array.from({length:30},(_,i)=>`<i style="--d:${(i*0.07).toFixed(2)}s"></i>`).join('');
function setL(on){listening=on;$('mic').classList.toggle('on',on);$('wv').classList.toggle('on',on);$('vt').textContent=on?'শুনছি… বলুন':'কথা বলতে মাইকে চাপুন'}
const vmsg=t=>{$('tr').textContent=t};
let MR=null,ST=null,AC=null,chunks=[];
function stopRec(){try{MR&&MR.state!=='inactive'&&MR.stop()}catch(e){}}
async function stt(blob){
 const b64=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.onerror=rej;f.readAsDataURL(blob)});
 const r=await sb.functions.invoke('omni-ai',{body:{stt:b64,mime:(blob.type||'audio/webm').split(';')[0]}});
 if(r.error){let m=r.error.message;try{const x=await r.error.context.text();try{m=JSON.parse(x).error||x}catch(_){m=x||m}}catch(_){}throw new Error(m)}
 if(!r.data||r.data.error)throw new Error((r.data&&r.data.error)||'লেখায় রূপান্তর হয়নি');
 return String(r.data.text||'').trim()}
$('mic').onclick=async()=>{
 if(listening){stopRec();return}
 if(busy)return;
 if(!navigator.mediaDevices||!window.MediaRecorder){vmsg('⚠️ এই ব্রাউজারে মাইক রেকর্ডিং চলে না। নিচের বক্সে লিখুন।');return}
 stopAudio();vmsg('মাইক চালু হচ্ছে…');
 try{ST=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
 catch(e){vmsg('⚠️ মাইকের অনুমতি পাওয়া যায়নি। ব্রাউজারের সাইট সেটিংসে মাইক Allow করুন।');return}
 const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(x=>MediaRecorder.isTypeSupported(x))||'';
 chunks=[];MR=new MediaRecorder(ST,mt?{mimeType:mt}:{});
 MR.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 let spoke=false,quiet=0,timer;const t0=Date.now();
 try{AC=new (window.AudioContext||window.webkitAudioContext)();const src=AC.createMediaStreamSource(ST),an=AC.createAnalyser();an.fftSize=512;src.connect(an);const buf=new Uint8Array(an.fftSize);
  timer=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));
   if(m>14){spoke=true;quiet=0}else if(spoke)quiet+=100;
   if((spoke&&quiet>900)||Date.now()-t0>25000)stopRec()},100)}catch(e){}
 MR.onstop=async()=>{clearInterval(timer);ST.getTracks().forEach(x=>x.stop());try{AC&&AC.close()}catch(e){}setL(false);
  const blob=new Blob(chunks,{type:MR.mimeType||mt||'audio/webm'});
  if(!spoke&&blob.size<4000){vmsg('কিছু শুনতে পাইনি। আবার মাইক চেপে বলুন।');return}
  vmsg('বুঝে নিচ্ছি…');
  try{const text=await stt(blob);if(!text){vmsg('কিছু বুঝতে পারিনি। আবার বলুন।');return}vmsg(text);send(text)}
  catch(e){vmsg('⚠️ '+e.message)}};
 MR.start();setL(true);vmsg('শুনছি… এখন বলুন (থামলে নিজেই শেষ হবে)')};
