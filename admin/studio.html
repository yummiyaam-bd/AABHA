<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0b11">
<title>AABHA | Photo Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.dg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dg label{font-size:12px;opacity:.7;margin-bottom:-6px}
.dg input[type=text],.dg input:not([type]),.dg input[type=file],.dg input[type=number],.dg select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;color:inherit;padding:12px 14px;font:inherit;font-size:14px;outline:none}
.dg input[type=range]{width:100%;accent-color:#e8b4a0}
.dg input[type=color]{width:100%;height:46px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:none;padding:4px}
.dg input[type=color].m{height:36px}
.dg input[type=checkbox]{width:auto}
.dg select option{color:#111}
.dg label.ck{display:flex;gap:8px;align-items:center;opacity:1;font-size:13px;margin-bottom:0}
.dgb{border:0;border-radius:40px;padding:13px 22px;font:800 12px inherit;letter-spacing:.1em;text-transform:uppercase;color:#fff;cursor:pointer;background:linear-gradient(135deg,#e8b4a0,#b8715a)}
.dgb:disabled{opacity:.5}
.dgb.g{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:inherit;border-radius:20px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chips button.on{background:linear-gradient(135deg,#e8b4a0,#b8715a);border-color:transparent;color:#fff}
#cvw{position:sticky;top:0;z-index:5;background:#0d0b11;padding:6px 0;text-align:center}
#cv{max-height:46vh;max-width:100%;width:auto;border-radius:14px;display:none;margin:0 auto;background:#111}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw.s{gap:8px}.sw.s button{width:30px;height:30px}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px #b8715a}
.dg details{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.03);padding:0 14px}
.dg details[open]{padding-bottom:14px}
.dg summary{cursor:pointer;padding:14px 0;font-weight:700;font-size:14px;list-style:none}
.dg summary::-webkit-details-marker{display:none}
.in{display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;line-height:1.6;opacity:.75;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.er{color:#ff9aa8;font-size:13px;line-height:1.6}
.dots{display:inline-flex;gap:5px;align-items:center;height:20px;padding:0 4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:#e8b4a0;display:block;animation:dj 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dj{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-7px);opacity:1}}
</style>

<body>
<div id="page">
  <section class="panel dg">
    <label>১. জামার ছবি (মডেলসহ)</label>
    <input id="im" type="file" accept="image/*">
    <div id="msg"></div>

    <div id="cvw"><canvas id="cv"></canvas></div>
    <div class="row" id="act" style="display:none">
      <button class="dgb g" id="tg" type="button">আসল ছবি দেখুন</button>
      <button class="dgb" id="dl" type="button">Download</button>
    </div>
    <label>ছবির মাপ</label>
    <select id="rt"><option value="4:5">৪:৫ (Instagram/Facebook পোস্ট)</option><option value="1:1">১:১ (চৌকো)</option><option value="orig">আসল মাপ</option></select>

    <details open><summary>🖼️ ব্যাকগ্রাউন্ড</summary><div class="in">
      <div class="chips" id="pre"></div>

    <details><summary>👤 মডেল: সাইজ ও জায়গা</summary><div class="in">

      <input id="sc" type="range" min="60" max="140" value="100">
      <label>ওপর-নিচ</label>
      <input id="oy" type="range" min="-25" max="25" value="0">
      <label>বাম-ডান</label>
      <input id="ox" type="range" min="-50" max="50" value="0">
      <div class="row">
        <button class="dgb g" type="button" data-ox="-25">⬅ বামে</button>
        <button class="dgb g" type="button" data-ox="0">মাঝে</button>
        <button class="dgb g" type="button" data-ox="25">ডানে ➡</button>

      <label class="ck"><input id="flip" type="checkbox"> মডেল উল্টে দিন (আয়না)</label>

    <details><summary>✍️ লেখা</summary><div class="in">
      <input id="tn" type="text" placeholder="পণ্যের নাম, যেমন: Mint Brocade Panjabi">
      <input id="ts" type="text" placeholder="ছোট লাইন, যেমন: Eid Collection 2026">
      <div class="row">
        <input id="tp" type="text" placeholder="দাম: 3250" inputmode="numeric">
        <input id="to" type="text" placeholder="পুরনো দাম: 3900" inputmode="numeric">
      </div>

      <label>ফন্ট</label>

        <option value="playfair">Playfair (রাজকীয়)</option>
        <option value="cormorant">Cormorant (লাক্সারি, চিকন)</option>

    <details><summary>🎨 লেখার স্টাইল</summary><div class="in">
      <label>নাম ও ছোট লাইনের রং</label>
      <div class="sw s" id="swn"></div>

      <label>দামের রং</label>

      <div class="row">

          <select id="tpos"><option value="bottom">নিচে</option><option value="center">মাঝখানে</option><option value="top">ওপরে</option></select></div>
        <div><label>সাজানো</label>

      </div>

      <select id="bs">
        <option value="grad">ছায়া (গ্রেডিয়েন্ট)</option>
        <option value="bar">কালো পটি</option>
        <option value="card">কালো কার্ড (গ্লাস)</option>
        <option value="cardL">সাদা কার্ড</option>
        <option value="none">কিছু না</option>
      </select>
      <label>পেছনের গাঢ়ত্ব</label>
      <input id="bo" type="range" min="0" max="100" value="80">

    <details><summary>🏷️ ট্যাগ, ব্র্যান্ড ও ফ্রেম</summary><div class="in">

      <label class="ck"><input id="tdisc" type="checkbox"> ট্যাগ ফাঁকা থাকলে ছাড়ের % নিজে বসান (পুরনো দাম লাগবে)</label>

      <div class="row">
        <div><label>ট্যাগের জায়গা</label>
          <select id="tps"><option value="tl">ওপরে-বামে</option><option value="tr">ওপরে-ডানে</option></select></div>
        <div><label>AABHA লোগো</label>
          <select id="brp"><option value="tr">ওপরে-ডানে</option><option value="tl">ওপরে-বামে</option><option value="br">নিচে-ডানে</option><option value="bc">নিচে-মাঝে</option><option value="none">লুকান</option></select></div>
      </div>

      <label>লোগো ও ফ্রেমের রং</label>
      <div class="sw s" id="swb"></div>
      <input id="brc" class="m" type="color" value="#ffffff">
      <label>ফ্রেম</label>
      <select id="frm"><option value="none">নেই</option><option value="thin">পাতলা</option><option value="double">ডাবল</option></select>

    <details><summary>✂️ কাটার সেটিং</summary><div class="in">

      <label>কিনারা পরিষ্কার (কম-বেশি করে দেখুন)</label>
      <input id="ed" type="range" min="0" max="100" value="60">
      <label class="ck"><input id="hf" type="checkbox" checked> জামার ভেতরের ফাঁকা অংশ ভরাট করুন</label>
      <button class="dgb g" id="rc" type="button">আবার কাটুন</button>
    </div></details>

    <div class="note">ℹ️ এটা ফ্রি টুল, ফোনের ভেতরেই চলে। প্রথমবার ৪০-৮৫ MB ডাউনলোড হয়, ১-২ মিনিট লাগতে পারে। পরেরবার দ্রুত হবে। জামার চুল বা ফিতার কিনারা ঠিক আছে কিনা বড় করে দেখে নিন।</div>

<script>
const A=Admin, $=A.$, esc=A.esc;

const BGS=[
 ['☀️ জানালার আলো','window'],['🤍 সাদা','white'],['🩶 স্টুডিও গ্রে','grey'],
 ['🌸 গোলাপি দেয়াল','pink'],['🌿 সবুজ বাগান','green'],['🌙 ডার্ক লাক্স','dark'],
 ['✨ ঈদ/উৎসব','gold'],['🎨 প্রিমিয়াম রং','color'],['🖼️ নিজের ছবি','image']
];
const SW=[
 ['Ivory','#f5efe6'],['Champagne','#e9dcc9'],['Sand','#d8c3a5'],['Rose Gold','#e8b4a0'],
 ['Blush','#f0d6d2'],['Dusty Rose','#d4a5a5'],['Lavender','#d9d0e8'],['Powder Blue','#c9d6e3'],
 ['Sage','#b7c4a8'],['Terracotta','#c46a4a'],['Gold','#c9a24a'],['Mocha','#8b6b57'],
 ['Olive','#6b705c'],['Emerald','#1f4d3f'],['Navy','#1c2a44'],['Burgundy','#6d1f2f'],
 ['Plum','#4a2c4a'],['Charcoal','#2b2b2f']
];
let RAW=null, ORIG=null, CUT=null, BGIMG=null, BG='window', busy=false, showOrig=false;

const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('ছবি পড়া যায়নি'));i.src=u});
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
function setMsg(h,cls){$('msg').className=cls||'';$('msg').innerHTML=h}
const dotsH='<span class="dots"><i></i><i></i><i></i></span> ';

/* ---------- ছবি ছোট করা ---------- */
async function shrink(file){
  const u=URL.createObjectURL(file), im=await loadImg(u);
  const m=1280, k=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const blob=await toBlob(c,'image/jpeg',0.92);
  URL.revokeObjectURL(u);
  return{img:await loadImg(URL.createObjectURL(blob)),blob};
}

/* ---------- ব্যাকগ্রাউন্ড কাটার টুল (ফ্রি, ব্রাউজারেই চলে) ---------- */
const LIBS=[
 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm',
 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm',
 'https://esm.sh/@imgly/background-removal@1.5.8'
];
let RB=null;
async function loadLib(){
  if(RB)return RB;
  let last;
  for(const u of LIBS){
    try{const m=await import(u);const f=m.removeBackground||m.default;if(typeof f==='function'){RB=f;return f}}
    catch(e){last=e}
  }
  throw new Error('কাটার টুল লোড হয়নি, ইন্টারনেট চেক করে আবার চেষ্টা করুন ('+((last&&last.message)||'')+')');
}

async function cut(){
  if(busy||!ORIG)return;
  busy=true;CUT=null;
  setMsg(dotsH+'কাটার টুল লোড হচ্ছে... (প্রথমবার ১-২ মিনিট লাগতে পারে)');
  try{
    const rb=await loadLib();
    const progress=(k,c,t)=>{if(t>0)setMsg(dotsH+(String(k).startsWith('fetch')?'টুল ডাউনলোড হচ্ছে ':'ছবি কাটা হচ্ছে ')+Math.round(c/t*100)+'%')};
    let blob;
    try{blob=await rb(ORIG.blob,{model:$('ql').value,output:{format:'image/png'},progress})}
    catch(e){blob=await rb(ORIG.blob,{output:{format:'image/png'},progress})}
    RAW=await loadImg(URL.createObjectURL(blob));refine(true);
    setMsg('✅ মডেল আলাদা হয়েছে। জামার কিনারা ঠিক না লাগলে "কিনারা পরিষ্কার" স্লাইডার নাড়ুন।');
  }catch(e){setMsg('সমস্যা হয়েছে: '+esc(e.message||e),'er')}
  busy=false;
}

/* ---------- কাটা অংশ পরিষ্কার করা (রং আসল ছবি থেকে, শুধু স্বচ্ছতা মডেল থেকে) ---------- */
function refine(){
  if(!RAW||!ORIG)return;
  const w=RAW.width,h=RAW.height;
  const c1=document.createElement('canvas');c1.width=w;c1.height=h;
  const g1=c1.getContext('2d',{willReadFrequently:true});g1.drawImage(RAW,0,0);
  const m=g1.getImageData(0,0,w,h).data;
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;
  const g2=c2.getContext('2d',{willReadFrequently:true});g2.drawImage(ORIG.img,0,0,w,h);
  const d=g2.getImageData(0,0,w,h), px=d.data;
  const t=Number($('ed').value)/100, lo=0.12+0.33*t, hi=0.7-0.2*t, n=w*h;
  const solid=new Uint8Array(n);
  for(let i=0;i<n;i++){
    let a=m[i*4+3]/255;a=Math.min(1,Math.max(0,(a-lo)/(hi-lo)));
    px[i*4+3]=Math.round(a*255);solid[i]=a>0.5?1:0;
  }
  if($('hf').checked){
    const out=new Uint8Array(n),st=[];
    const push=i=>{if(!solid[i]&&!out[i]){out[i]=1;st.push(i)}};
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
    for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    while(st.length){const i=st.pop(),x=i%w,y=(i/w)|0;
      if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}
    for(let i=0;i<n;i++){if(!solid[i]&&!out[i])px[i*4+3]=255}
  }
  g2.putImageData(d,0,0);
  CUT=c2;
  render();
}
let _deb;const refineSoon=()=>{clearTimeout(_deb);_deb=setTimeout(refine,160)};

/* ---------- ব্যাকগ্রাউন্ড আঁকা ---------- */
const hasF=g=>'filter' in g;
function withBlur(g,px,fn){if(hasF(g)){g.save();g.filter='blur('+px+'px)';fn();g.restore()}else fn()}
function poly(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}
function bokeh(g,W,H,rgb,n,seed){
  let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  withBlur(g,W*.006,()=>{for(let i=0;i<n;i++){
    const x=r()*W,y=r()*H,rad=(.02+r()*.06)*W;
    g.fillStyle='rgba('+rgb+','+(.12+r()*.25).toFixed(2)+')';g.beginPath();g.arc(x,y,rad,0,7);g.fill()}});
}
function wall(g,W,H,c1,c2,shade){
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W*.2,H*.22,0,W*.2,H*.22,W*.8);
  gl.addColorStop(0,'rgba(255,250,240,.55)');gl.addColorStop(1,'rgba(255,250,240,0)');
  g.fillStyle=gl;g.fillRect(0,0,W,H);
  // জানালার তির্যক ছায়া
  g.fillStyle=shade;
  withBlur(g,W*.015,()=>poly(g,[[W*.46,-20],[W+20,-20],[W+20,H+20],[W*.08,H+20]]));
}
function drawBg(g,W,H){
  if(BG==='window')wall(g,W,H,'#f1e6d9','#d9c5b0','rgba(120,90,68,.30)');
  else if(BG==='pink')wall(g,W,H,'#f0d6d2','#d4a8a8','rgba(120,70,80,.28)');
  else if(BG==='white'){const r=g.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.8);r.addColorStop(0,'#ffffff');r.addColorStop(1,'#e6e2de');g.fillStyle=r;g.fillRect(0,0,W,H)}
  else if(BG==='grey'){const r=g.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H)*.85);r.addColorStop(0,'#dcdcdf');r.addColorStop(1,'#8c8c93');g.fillStyle=r;g.fillRect(0,0,W,H)}
  else if(BG==='dark'){const r=g.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H)*.9);r.addColorStop(0,'#4a2e3f');r.addColorStop(1,'#0d0b11');g.fillStyle=r;g.fillRect(0,0,W,H)}
  else if(BG==='green'){const l=g.createLinearGradient(0,0,0,H);l.addColorStop(0,'#d5e6c6');l.addColorStop(1,'#5f8c55');g.fillStyle=l;g.fillRect(0,0,W,H);bokeh(g,W,H,'255,255,235',16,7)}
  else if(BG==='gold'){const r=g.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.9);r.addColorStop(0,'#4a3320');r.addColorStop(1,'#0d0b11');g.fillStyle=r;g.fillRect(0,0,W,H);bokeh(g,W,H,'255,205,120',26,11)}
  else if(BG==='color'){const c=$('bc').value;g.fillStyle=c;g.fillRect(0,0,W,H);const r=g.createRadialGradient(W*.3,H*.25,0,W*.3,H*.25,W);r.addColorStop(0,'rgba(255,255,255,.28)');r.addColorStop(1,'rgba(0,0,0,.12)');g.fillStyle=r;g.fillRect(0,0,W,H)}
  else if(BG==='image'&&BGIMG){const k=Math.max(W/BGIMG.width,H/BGIMG.height),dw=BGIMG.width*k,dh=BGIMG.height*k;g.drawImage(BGIMG,(W-dw)/2,(H-dh)/2,dw,dh)}
  else{g.fillStyle='#e8d9c8';g.fillRect(0,0,W,H)}
}

/* ---------- লেখা ও সাজসজ্জা ---------- */
const num=v=>Number(String(v||'').replace(/[^\d.]/g,''))||0;
const lum=c=>{const n=parseInt(String(c).slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255};
const setLS=(g,px)=>{if('letterSpacing' in g)g.letterSpacing=px+'px'};
const rr=(g,x,y,w,h,r)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)};
const FONTS={
  playfair:{fam:'"Playfair Display","Noto Serif Bengali",Georgia,serif',w:700},
  cormorant:{fam:'"Cormorant Garamond","Noto Serif Bengali",Georgia,serif',w:700},
  poppins:{fam:'"Poppins","Hind Siliguri",sans-serif',w:600},
  hind:{fam:'"Hind Siliguri","Poppins",sans-serif',w:700},
  notoserif:{fam:'"Noto Serif Bengali","Playfair Display",serif',w:700}
};

function drawTexts(g,W,H){
  const S=W/1080, ts=Number($('tz').value)/100*S, F=FONTS[$('fn').value]||FONTS.playfair;
  const name=$('tn').value.trim(), sub=$('ts').value.trim(), cta=$('tc').value.trim();
  const pn=num($('tp').value), po=num($('to').value);
  const price=pn>0?'৳'+pn.toLocaleString('en-US'):'', old=po>0?'৳'+po.toLocaleString('en-US'):'';
  if(!(name||sub||price||old||cta))return;
  const style=$('bs').value, op=Number($('bo').value)/100, pos=$('tpos').value, al=$('tal').value;
  const card=style==='card'||style==='cardL', M=60*S, ip=card?26*S:0;
  const ax=al==='left'?M+ip:al==='right'?W-M-ip:W/2;
  let cN=$('cn').value, cP=$('cp').value;
  if(style==='cardL'){if(lum(cN)>.7)cN='#1b1418';if(lum(cP)>.8)cP='#8a4a37'}
  const maxW=W-2*M-2*ip;
  let nfs=64*ts;g.font=F.w+' '+nfs+'px '+F.fam;
  while(name&&g.measureText(name).width>maxW&&nfs>20*S){nfs-=2;g.font=F.w+' '+nfs+'px '+F.fam}
  const sfs=32*ts, pfs=56*ts, cfs=28*ts, gap=12*ts, LH=1.22;
  const rows=[];
  if(name)rows.push(['n',nfs]);
  if(sub)rows.push(['s',sfs]);
  if(price||old)rows.push(['p',pfs]);
  if(cta)rows.push(['c',cfs]);
  const bh=rows.reduce((a,r)=>a+r[1]*LH,0)+gap*(rows.length-1), pad=34*S, dark='10,6,12';
  const top=pos==='bottom'?H-M-bh-ip:pos==='top'?M+96*S:(H-bh)/2;

  if(style==='grad'){
    let y0,y1,st;
    if(pos==='bottom'){y0=Math.max(0,top-pad*3.2);y1=H;st=[[0,0],[1,op]]}
    else if(pos==='top'){y0=0;y1=top+bh+pad*3.2;st=[[0,op],[1,0]]}
    else{y0=Math.max(0,top-pad*3);y1=Math.min(H,top+bh+pad*3);st=[[0,0],[.35,op],[.65,op],[1,0]]}
    const gr=g.createLinearGradient(0,y0,0,y1);
    st.forEach(s=>gr.addColorStop(s[0],'rgba('+dark+','+s[1]+')'));
    g.fillStyle=gr;g.fillRect(0,y0,W,y1-y0);
  }else if(style==='bar'){
    g.fillStyle='rgba('+dark+','+op+')';g.fillRect(0,top-pad,W,bh+2*pad);
  }else if(card){
    const cx=M*.6, cw=W-2*cx, cy=top-pad, ch=bh+2*pad;
    g.save();rr(g,cx,cy,cw,ch,30*S);
    g.fillStyle=style==='cardL'?'rgba(255,255,255,'+op+')':'rgba('+dark+','+(op*.9)+')';g.fill();
    g.lineWidth=1.5*S;g.strokeStyle=style==='cardL'?'rgba(0,0,0,.08)':'rgba(255,255,255,.16)';g.stroke();g.restore();
  }

  g.save();
  g.textBaseline='top';g.textAlign=al==='center'?'center':al;
  if($('tsh').checked){g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=12*S;g.shadowOffsetY=2*S}
  let y=top;
  for(const [k,h] of rows){
    if(k==='n'){g.font=F.w+' '+h+'px '+F.fam;g.fillStyle=cN;g.fillText(name,ax,y)}
    else if(k==='s'){g.font='500 '+h+'px '+F.fam;g.globalAlpha=.88;g.fillStyle=cN;g.fillText(sub,ax,y);g.globalAlpha=1}
    else if(k==='c'){g.font='600 '+h+'px '+F.fam;setLS(g,2*S);g.globalAlpha=.92;g.fillStyle=cN;g.fillText(cta,ax,y);g.globalAlpha=1;setLS(g,0)}
    else{
      g.textAlign='left';
      g.font='700 '+h+'px '+F.fam;const wp=price?g.measureText(price).width:0;
      const of=h*.6;g.font='500 '+of+'px '+F.fam;const wo=old?g.measureText(old).width:0;
      const gp=(price&&old)?18*S:0, tot=wp+gp+wo;
      const x0=al==='left'?ax:al==='right'?ax-tot:ax-tot/2;
      if(price){g.font='700 '+h+'px '+F.fam;g.fillStyle=cP;g.fillText(price,x0,y)}
      if(old){
        g.font='500 '+of+'px '+F.fam;g.globalAlpha=.75;g.fillStyle=cN;
        const xo=x0+wp+gp, yo=y+h*.32;
        g.fillText(old,xo,yo);
        g.shadowColor='transparent';g.lineWidth=2.5*S;g.strokeStyle=cN;
        g.beginPath();g.moveTo(xo,yo+of*.55);g.lineTo(xo+wo,yo+of*.55);g.stroke();g.globalAlpha=1;
      }
      g.textAlign=al==='center'?'center':al;
    }
    y+=h*LH+gap;
  }
  g.restore();
}

function drawTag(g,W,H){
  const S=W/1080;let t=$('tt').value.trim();
  const pn=num($('tp').value), po=num($('to').value);
  if(!t&&$('tdisc').checked&&po>pn&&pn>0)t='-'+Math.round((1-pn/po)*100)+'%';
  if(!t)return;
  const col=$('tcol').value, tp=$('tps').value, brp=$('brp').value;
  g.save();
  g.font='700 '+(30*S)+'px Poppins,"Hind Siliguri",sans-serif';g.textBaseline='middle';g.textAlign='left';
  const tw=g.measureText(t).width+46*S, th=58*S;
  let y=48*S;if(brp===tp)y+=80*S;
  const x=tp==='tl'?48*S:W-48*S-tw;
  rr(g,x,y,tw,th,th/2);g.fillStyle=col;g.fill();
  g.fillStyle=lum(col)>.65?'#1b1418':'#ffffff';g.fillText(t,x+23*S,y+th/2+1*S);
  g.restore();
}

function drawBrand(g,W,H){
  const p=$('brp').value;if(p==='none')return;
  const S=W/1080, bs=Number($('brs').value)/100, col=$('brc').value, ls=8*S*bs, m=48*S, h=34*S*bs;
  g.save();
  g.font='600 '+h+'px "Playfair Display",Georgia,serif';g.fillStyle=col;g.textBaseline='top';
  setLS(g,ls);g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=8*S;
  if(p==='tr'){g.textAlign='right';g.fillText('AABHA',W-m+ls,m)}
  else if(p==='tl'){g.textAlign='left';g.fillText('AABHA',m,m)}
  else if(p==='br'){g.textAlign='right';g.fillText('AABHA',W-m+ls,H-m-h)}
  else{g.textAlign='center';g.fillText('AABHA',W/2+ls/2,H-m-h)}
  g.restore();
}

function drawFrame(g,W,H){
  const f=$('frm').value;if(f==='none')return;
  const S=W/1080;
  g.save();g.strokeStyle=$('brc').value;g.globalAlpha=.85;
  g.lineWidth=3*S;g.strokeRect(26*S,26*S,W-52*S,H-52*S);
  if(f==='double'){g.lineWidth=1.5*S;g.strokeRect(40*S,40*S,W-80*S,H-80*S)}
  g.restore();
}

/* ---------- পুরো ছবি তৈরি ---------- */
function render(){
  if(!ORIG)return;
  const W=1080, src=ORIG.img, r=$('rt').value;
  let H;
  if(r==='orig')H=Math.round(W*src.height/src.width);
  else{const [a,b]=r.split(':').map(Number);H=Math.round(W*b/a)}
  const c=$('cv');c.width=W;c.height=H;c.style.display='block';
  const g=c.getContext('2d');
  const scl=Number($('sc').value)/100, oy=Number($('oy').value)/100*H, oxp=Number($('ox').value)/100*W, flip=$('flip').checked;

  const useCut=!!CUT&&!showOrig;
  if(!useCut){
    g.fillStyle='#111';g.fillRect(0,0,W,H);
    const k=Math.min(W/src.width,H/src.height),dw=src.width*k,dh=src.height*k;
    g.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{
    drawBg(g,W,H);
    const k=Math.min(W/CUT.width,H/CUT.height)*scl, dw=CUT.width*k, dh=CUT.height*k;
    const dx=(W-dw)/2+oxp, dy=H-dh+oy, fx=flip?W-dx-dw:dx;
    g.save();
    if(flip){g.translate(W,0);g.scale(-1,1)}
    const sh=document.createElement('canvas');sh.width=W;sh.height=H;
    const sg=sh.getContext('2d');
    sg.drawImage(CUT,fx,dy,dw,dh);
    sg.globalCompositeOperation='source-in';sg.fillStyle='rgba(40,25,20,1)';sg.fillRect(0,0,W,H);
    g.save();if(hasF(g))g.filter='blur('+(W*.018)+'px)';g.globalAlpha=.4;g.drawImage(sh,(flip?-1:1)*W*.045,H*.008);g.restore();
    g.drawImage(CUT,fx,dy,dw,dh);
    g.restore();
  }

  drawTexts(g,W,H);
  drawTag(g,W,H);
  drawBrand(g,W,H);
  drawFrame(g,W,H);

  $('act').style.display=CUT?'flex':'none';
  $('tg').textContent=showOrig?'নতুন ছবি দেখুন':'আসল ছবি দেখুন';
}

/* ফন্ট (বাংলা সহ) লোড হয়ে গেলে আবার আঁকা */
async function ensureFonts(){
  const F=FONTS[$('fn').value]||FONTS.playfair;
  const txt=[$('tn').value,$('ts').value,$('tp').value,$('to').value,$('tc').value,$('tt').value,'৳0123456789AABHA'].join(' ');
  try{await Promise.all([
    document.fonts.load('700 40px '+F.fam,txt),
    document.fonts.load('500 30px '+F.fam,txt),
    document.fonts.load('600 30px "Playfair Display"','AABHA'),
    document.fonts.load('700 30px Poppins',$('tt').value||'NEW')
  ])}catch(_){}
  render();
}
let _fd;const fontSoon=()=>{clearTimeout(_fd);_fd=setTimeout(ensureFonts,300)};

function mkSw(boxId,inpId,list){
  const box=$(boxId), inp=$(inpId);
  box.innerHTML=list.map(c=>`<button type="button" data-c="${c}" style="background:${c}"></button>`).join('');
  const sync=()=>[...box.children].forEach(b=>b.classList.toggle('on',b.dataset.c===inp.value.toLowerCase()));
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;inp.value=b.dataset.c;inp.dispatchEvent(new Event('input',{bubbles:true}))};
  inp.addEventListener('input',sync);sync();
}

Admin.boot({key:'studio',title:'Photo Studio',perm:'products',ready:async()=>{
  /* ব্যাকগ্রাউন্ড */
  $('pre').innerHTML=BGS.map((b,i)=>`<button type="button" data-k="${b[1]}" class="${i?'':'on'}">${esc(b[0])}</button>`).join('');
  $('pre').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    [...$('pre').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
    BG=b.dataset.k;
    $('bc').style.display=BG==='color'?'block':'none';
    $('sw').style.display=BG==='color'?'flex':'none';
    $('bi').style.display=BG==='image'?'block':'none';
    render();
  };
  $('sw').innerHTML=SW.map((c,i)=>`<button type="button" title="${c[0]}" data-c="${c[1]}" class="${i===1?'on':''}" style="background:${c[1]}"></button>`).join('');
  $('bc').value=SW[1][1];
  $('sw').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...$('sw').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
    $('bc').value=b.dataset.c;render()};
  $('bc').oninput=()=>{[...$('sw').children].forEach(x=>x.classList.remove('on'));render()};
  $('bi').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{BGIMG=await loadImg(URL.createObjectURL(f));render()}catch(err){A.toast(err.message)}
  };

  /* রং বাছাই */
  mkSw('swn','cn',['#ffffff','#f5efe6','#e8c27a','#e8b4a0','#c9a24a','#1b1418','#6d1f2f','#1f4d3f']);
  mkSw('swp','cp',['#e8b4a0','#e8c27a','#ffffff','#c9a24a','#b8715a','#1b1418','#6d1f2f','#1f4d3f']);
  mkSw('swt','tcol',['#b8715a','#6d1f2f','#1f4d3f','#c9a24a','#1b1418','#ffffff']);
  mkSw('swb','brc',['#ffffff','#f5efe6','#e8c27a','#1b1418']);

  /* ছবি দেওয়া */
  $('im').onchange=async e=>{
    const f=e.target.files[0];CUT=null;RAW=null;showOrig=false;
    if(!f)return;
    try{ORIG=await shrink(f);render();cut()}catch(err){setMsg(esc(err.message),'er')}
  };

  /* সব কন্ট্রোল */
  ['sc','oy','ox','flip','tz','cn','cp','tpos','tal','bs','bo','tsh','tcol','tps','tdisc','brp','brs','brc','frm','rt']
    .forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});
  ['tn','ts','tp','to','tc','tt'].forEach(id=>$(id).addEventListener('input',()=>{render();fontSoon()}));
  $('fn').addEventListener('change',ensureFonts);
  document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{$('ox').value=b.dataset.ox;render()});
  $('ed').addEventListener('input',refineSoon);
  $('hf').onchange=refine;
  $('rc').onclick=cut;
  $('tg').onclick=()=>{showOrig=!showOrig;render()};
  $('dl').onclick=async()=>{
    const was=showOrig;showOrig=false;
    await ensureFonts();
    const b=await toBlob($('cv'),'image/jpeg',0.92);
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aabha-'+Date.now()+'.jpg';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    showOrig=was;render();
  };
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(ORIG)render()});
}});
