<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AABHA Secure Admin Login</title>
    <!-- সরাসরি সুপাবেস লাইব্রেরি লিংক -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1f2937; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 360px; text-align: center; border: 1px solid #374151; }
        h2 { color: #fff; margin-bottom: 25px; font-weight: 600; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #111827; border: 1px solid #4b5563; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        .error-msg { color: #ef4444; font-size: 14px; margin-bottom: 15px; display: none; font-weight: 600; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 6px; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 AABHA Admin Gate</h2>
        <div id="error-display-box" class="error-msg">ভুল ইমেইল অথবা পাসওয়ার্ড!</div>
        
        <input type="email" id="admin-email-input" placeholder="অ্যাডমিন ইমেইল লিখুন" required>
        <input type="password" id="admin-pass-input" placeholder="সিক্রেট পাসওয়ার্ড লিখুন" required>
        <button onclick="executeAdminLogin()">প্রবেশ করুন</button>
    </div>

    <script>
        // প্রথমে সুপাবেস কানেকশন ইনিশিয়েলাইজ করা (যাতে এরর না আসে)
        const LOGIN_URL = "https://xjwuozdfuflfoqiuucik.supabase.co";
        const LOGIN_KEY = "sb_publishable_vyOh8uTL-GUcuPD4PevQ5w_qIbNJ8fm";
        const sbInstance = supabase.createClient(LOGIN_URL, LOGIN_KEY);

        // এবার লগইন ফাংশন রান করা
        async function executeAdminLogin() {
            const emailValue = document.getElementById('admin-email-input').value;
            const passwordValue = document.getElementById('admin-pass-input').value;
            const errorBox = document.getElementById('error-display-box');
            
            errorBox.style.display = 'none';

            if(!emailValue || !passwordValue) {
                errorBox.style.display = 'block';
                errorBox.innerText = "⚠️ দয়া করে ইমেইল এবং পাসওয়ার্ড দুটিই লিখুন!";
                return;
            }

            try {
                const { data, error } = await sbInstance.auth.signInWithPassword({ 
                    email: emailValue, 
                    password: passwordValue 
                });

                if (error) {
                    errorBox.style.display = 'block';
                    errorBox.innerText = "⛔ ভুল ইমেইল বা পাসওয়ার্ড! আবার চেষ্টা করুন।";
                } else if (data && data.user) {
                    alert("🎉 লগইন সফল! প্রিমিয়াম ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...");
                    window.location.replace("index.html");
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerText = "🚨 কানেকশনে সমস্যা হয়েছে: " + err.message;
            }
        }
    </script>
</body>
</html>
